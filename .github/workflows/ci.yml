name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Tests of p-addition
        working-directory: p-dodawanie
        run: python -m pytest -q test_pdodawanie.py
